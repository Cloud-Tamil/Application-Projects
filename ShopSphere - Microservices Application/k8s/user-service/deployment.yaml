apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopsphere
  labels: { app: user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: shopsphere/user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: shopsphere-config }
            - secretRef:    { name: shopsphere-secrets }
          env: [{ name: PORT, value: "3002" }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: shopsphere, labels: { app: user-service } }
spec:
  selector: { app: user-service }
  ports: [{ port: 3002, targetPort: 3002 }]
