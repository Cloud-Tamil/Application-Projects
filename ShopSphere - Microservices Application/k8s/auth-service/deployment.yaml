apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shopsphere
  labels: { app: auth-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: shopsphere/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: shopsphere-config }
            - secretRef:    { name: shopsphere-secrets }
          env:
            - name: PORT
              value: "3001"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: shopsphere, labels: { app: auth-service } }
spec:
  selector: { app: auth-service }
  ports: [{ port: 3001, targetPort: 3001 }]
