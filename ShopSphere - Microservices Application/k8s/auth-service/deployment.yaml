apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shopsphere
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: shopsphere/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/authdb"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: JWT_EXPIRES
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 4001
            periodSeconds: 5
            failureThreshold: 12
          terminationMessagePolicy: FallbackToLogsOnError
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: shopsphere
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
