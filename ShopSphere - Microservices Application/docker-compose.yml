version: "3.9"

networks:
  shopsphere:
    driver: bridge

volumes:
  mongo-data:
  magento-data:

services:
  mongo:
    image: mongo:6.0
    container_name: shopsphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shopsphere
    volumes:
      - mongo-data:/data/db
    networks:
      - shopsphere
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: shopsphere-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/shopsphere
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shopsphere

  user-service:
    build:
      context: ./user-service
    container_name: shopsphere-user
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/shopsphere
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shopsphere

  order-service:
    build:
      context: ./order-service
    container_name: shopsphere-order
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/shopsphere
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shopsphere

  api-gateway:
    build:
      context: ./api-gateway
    container_name: shopsphere-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    depends_on:
      - auth-service
      - user-service
      - order-service
    networks:
      - shopsphere

  frontend:
    build:
      context: ./frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api-gateway
    networks:
      - shopsphere
